# Local parity for the two backend processes + frontend. Supabase itself is
# external (hosted) — this doesn't stand up a local Postgres.
services:
  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "worker.main"]
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
