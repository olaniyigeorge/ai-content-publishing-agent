[project]
name = "koya-content-agent-backend"
version = "0.1.0"
description = "AI content research and publishing agent — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "supabase>=2.7",
    "anthropic>=0.34",
    "httpx>=0.27",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "bcrypt>=4.2",
    "resend>=2.4",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "auth", "claude", "db", "shared", "worker"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Cookie()/Query() *are* meant to live in default
# argument position — that's the framework's DI mechanism, not the mutable-
# default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query", "fastapi.Header", "fastapi.Body"]
